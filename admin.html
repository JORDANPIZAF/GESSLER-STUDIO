.app{min-height:100vh;display:flex;flex-direction:column;background:#0A0B0F;}
.nav{border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:54px;background:var(--bg2);position:sticky;top:0;z-index:100;gap:6px;}
.nav-brand{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.nav-logo{width:22px;height:22px;background:var(--orange);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);}
.nav-name{font-weight:800;font-size:11px;letter-spacing:.15em;color:var(--text);}
.nav-name-s{display:none;font-weight:800;font-size:11px;letter-spacing:.1em;color:var(--text);}
.nav-tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{padding:8px 10px;border-radius:var(--r);font-size:11px;font-weight:700;letter-spacing:.03em;cursor:pointer;border:none;background:transparent;color:var(--tdim);font-family:var(--font);display:flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap;flex-shrink:0;min-height:36px;}
.nav-tab:hover{background:var(--bg3);color:var(--tmid);}
.nav-tab.active{background:var(--odim);color:var(--orange);}
.nav-tab .tl{display:inline;}
.nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.nav-user{font-size:9px;color:var(--tdim);font-family:var(--mono);}
.btn-logout{padding:7px 10px;border-radius:var(--r);font-size:11px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--tdim);display:flex;align-items:center;gap:4px;transition:all .15s;min-height:34px;}
.btn-logout:hover{border-color:var(--red);color:var(--red);}
.main{flex:1;padding:20px 16px 32px;max-width:960px;margin:0 auto;width:100%;background:#0A0B0F;}
/* FOOTER */
.app-footer{background:var(--bg2);border-top:1px solid var(--border);padding:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.footer-brand{display:flex;align-items:center;gap:7px;}
.footer-hex{width:16px;height:16px;background:var(--orange);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);}
.footer-name{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--tmid);}
.footer-tag{font-size:9px;color:var(--tdim);font-family:var(--mono);}
.footer-links{display:flex;gap:6px;flex-wrap:wrap;}
.footer-btn{padding:5px 10px;border-radius:var(--r);font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--tdim);font-family:var(--font);display:flex;align-items:center;gap:4px;transition:all .15s;white-space:nowrap;}
.footer-btn:hover{border-color:var(--border2);color:var(--tmid);}
.footer-btn.orange{border-color:var(--odim);color:var(--orange);}
.footer-btn.orange:hover{background:var(--odim);}
.footer-copy{font-size:9px;color:var(--tdim);font-family:var(--mono);}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#0A0B0F!important;background-image:radial-gradient(circle at 15% 50%,rgba(243,90,56,.07) 0%,transparent 55%),radial-gradient(circle at 85% 20%,rgba(20,151,224,.06) 0%,transparent 50%);}
.login-card{width:100%;max-width:340px;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;overflow:hidden;}
.login-hdr{background:var(--bg3);padding:28px 24px 22px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:9px;}
.login-hex{width:34px;height:34px;background:var(--orange);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);}
.login-brand{font-size:13px;font-weight:800;letter-spacing:.18em;color:var(--text);}
.login-sub{font-size:9px;color:var(--tdim);font-family:var(--mono);letter-spacing:.12em;}
.login-body{padding:22px;display:flex;flex-direction:column;gap:12px;}
.login-err{background:var(--rdim);border:1px solid rgba(255,82,82,.2);border-radius:var(--r);padding:8px 11px;font-size:11px;color:var(--red);font-family:var(--mono);}
.pw-wrap{position:relative;}
.pw-wrap .input{padding-right:36px;}
.pw-eye{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--tdim);cursor:pointer;padding:2px;display:flex;align-items:center;}
.pw-eye:hover{color:var(--tmid);}
.login-btn{width:100%;padding:10px;border:none;border-radius:var(--r);background:var(--orange);color:#fff;font-family:var(--font);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:background .15s;}
.login-btn:hover{background:#ff7340;}
.login-btn:disabled{opacity:.4;cursor:not-allowed;}
.btn{padding:6px 12px;border-radius:var(--r);font-size:10px;font-weight:800;letter-spacing:.05em;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:4px;transition:all .15s;font-family:var(--font);text-transform:uppercase;white-space:nowrap;}
.btn-primary{background:var(--orange);color:#fff;}.btn-primary:hover{background:#ff7340;}.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--tmid);border:1px solid var(--border2);}.btn-ghost:hover{border-color:var(--border3);color:var(--text);}
.btn-blue{background:var(--blue);color:#0a0a0a;}.btn-blue:hover{background:#6db5ff;}.btn-blue:disabled{opacity:.4;cursor:not-allowed;}
.btn-green{background:var(--green);color:#0a0a0a;}.btn-green:hover{background:#5fe0a5;}
.btn-danger{background:transparent;color:var(--red);border:1px solid rgba(255,82,82,.2);}.btn-danger:hover{background:var(--rdim);}
.btn-sm{padding:4px 8px;font-size:9px;}
.btn-icon{padding:5px;border-radius:var(--r);background:transparent;border:1px solid var(--border);cursor:pointer;color:var(--tdim);display:inline-flex;transition:all .15s;}.btn-icon:hover{border-color:var(--border2);color:var(--tmid);}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:9px;font-weight:700;color:var(--tdim);letter-spacing:.1em;text-transform:uppercase;font-family:var(--mono);}
.input{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:7px 9px;color:var(--text);font-size:12px;font-family:var(--font);outline:none;transition:border-color .15s;width:100%;}
.input::placeholder{color:var(--tdim);}
.input:focus{border-color:var(--orange);}
select.input{cursor:pointer;-webkit-appearance:none;}
select.input option{background:var(--bg3);color:var(--text);}
textarea.input{resize:vertical;min-height:56px;line-height:1.5;}
.sec-hdr{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px;padding-bottom:11px;border-bottom:1px solid var(--border);gap:7px;flex-wrap:wrap;}
.sec-title{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--text);}
.sec-title span{color:var(--orange);}
.sec-sub{font-size:10px;color:var(--tdim);font-family:var(--mono);margin-top:2px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.87);z-index:200;display:flex;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(6px);}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:20px;width:100%;max-width:500px;max-height:93vh;overflow-y:auto;}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-title{font-size:13px;font-weight:800;color:var(--text);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;}
.flex-end{display:flex;justify-content:flex-end;gap:6px;margin-top:16px;}
.mt8{margin-top:8px;}.mt12{margin-top:12px;}.mt16{margin-top:16px;}
.divider{border:none;border-top:1px solid var(--border);margin:10px 0;}
.tbl-wrap{border:1px solid var(--border);border-radius:6px;overflow:hidden;overflow-x:auto;background:var(--bg2);}
table{width:100%;border-collapse:collapse;min-width:400px;background:var(--bg2);}
th{text-align:left;padding:7px 10px;font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--blue);background:var(--bg3);border-bottom:1px solid var(--border);text-transform:uppercase;font-family:var(--mono);white-space:nowrap;}
td{padding:9px 10px;font-size:11px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--tmid);background:var(--bg2);}
td strong{color:var(--text);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg3);}
.cat-badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:9px;font-weight:700;background:var(--bdim);color:var(--blue);font-family:var(--mono);white-space:nowrap;}
.price-c{font-family:var(--mono);font-size:11px;color:var(--orange);font-weight:700;white-space:nowrap;}
.acts{display:flex;gap:3px;}
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:3px;font-size:9px;font-weight:700;font-family:var(--mono);}
.combo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px;}
.combo-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:13px;position:relative;overflow:hidden;}
.combo-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--orange),var(--blue));}
.combo-name{font-size:12px;font-weight:800;margin-bottom:3px;color:var(--text);}
.combo-desc{font-size:10px;color:var(--tdim);margin-bottom:7px;line-height:1.5;}
.combo-badge{display:inline-flex;align-items:center;gap:3px;background:var(--gdim);color:var(--green);padding:2px 5px;border-radius:3px;font-size:9px;font-weight:700;font-family:var(--mono);}
.combo-prices{font-family:var(--mono);margin-top:5px;}
.combo-orig{font-size:10px;color:var(--tdim);text-decoration:line-through;}
.combo-fin{font-size:13px;color:var(--orange);font-weight:700;}
.combo-acts{display:flex;gap:4px;margin-top:9px;}
.quote-layout{display:grid;grid-template-columns:1fr 320px;gap:12px;align-items:start;}
.sel-panel{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:14px;}
.q-sidebar{position:sticky;top:62px;}
.q-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:14px;}
.seg{display:flex;background:var(--bg3);border-radius:var(--r);padding:3px;margin-bottom:11px;}
.seg-btn{flex:1;padding:5px 6px;border-radius:3px;border:none;background:transparent;color:var(--tdim);font-size:9px;font-weight:800;cursor:pointer;font-family:var(--font);letter-spacing:.05em;text-transform:uppercase;transition:all .15s;}
.seg-btn.active{background:var(--bg4);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.5);}
.cat-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--blue);text-transform:uppercase;font-family:var(--mono);padding:8px 0 3px;}
.svc-item{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.svc-item:last-child{border-bottom:none;}
.svc-chk{width:15px;height:15px;border-radius:3px;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.svc-chk.on{background:var(--orange);border-color:var(--orange);}
.svc-nm{font-size:11px;font-weight:600;flex:1;line-height:1.3;color:var(--text);}
.svc-pr{font-family:var(--mono);font-size:9px;color:var(--orange);flex-shrink:0;}
.qty-row{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.qty-btn{width:17px;height:17px;border-radius:3px;border:1px solid var(--border2);background:transparent;color:var(--tmid);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;transition:all .15s;}
.qty-btn:hover{border-color:var(--orange);color:var(--orange);}
.qty-n{font-family:var(--mono);font-size:10px;width:15px;text-align:center;color:var(--text);}
.sum-item{display:flex;justify-content:space-between;align-items:flex-start;gap:4px;margin-bottom:5px;}
.sum-nm{font-size:10px;color:var(--tmid);line-height:1.4;}
.sum-pr{font-family:var(--mono);font-size:10px;flex-shrink:0;color:var(--text);}
.sum-div{border:none;border-top:1px solid var(--border);margin:7px 0;}
.sum-tot-row{display:flex;justify-content:space-between;align-items:center;}
.sum-tot-lbl{font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--tdim);text-transform:uppercase;font-family:var(--mono);}
.sum-tot-amt{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--orange);}
.disc-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--green);margin-top:2px;}
.tax-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;margin-top:2px;}
.tax-row.add{color:var(--red);}.tax-row.sub{color:var(--green);}
.disc-input-row{display:flex;gap:5px;align-items:center;margin-top:5px;}
.tax-panel{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:11px;margin-top:11px;}
.tax-panel-title{font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--tdim);text-transform:uppercase;font-family:var(--mono);margin-bottom:7px;display:flex;align-items:center;gap:4px;}
.tax-item{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--border);}
.tax-item:last-child{border-bottom:none;}
.tax-toggle{width:30px;height:16px;border-radius:9px;border:1px solid var(--border2);background:var(--bg4);cursor:pointer;position:relative;flex-shrink:0;transition:all .15s;}
.tax-toggle.on{background:var(--orange);border-color:var(--orange);}
.tax-knob{position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--tdim);transition:all .2s;}
.tax-toggle.on .tax-knob{left:16px;background:#fff;}
.tax-info{flex:1;}
.tax-name{font-size:10px;font-weight:700;color:var(--text);}
.tax-rate{font-size:9px;font-family:var(--mono);margin-top:1px;}
.tax-rate.add{color:var(--red);}.tax-rate.sub{color:var(--green);}
.tax-type-badge{display:inline-block;padding:1px 4px;border-radius:2px;font-size:8px;font-weight:700;font-family:var(--mono);margin-left:3px;}
.tax-type-badge.add{background:var(--rdim);color:var(--red);}
.tax-type-badge.sub{background:var(--gdim);color:var(--green);}
.tax-tooltip{font-size:9px;color:var(--tdim);margin-top:2px;line-height:1.4;display:none;}
.tax-item:hover .tax-tooltip{display:block;}
.combo-opt{border:1px solid var(--border);border-radius:5px;padding:9px 11px;cursor:pointer;transition:all .15s;margin-bottom:6px;}
.combo-opt.on{border-color:var(--orange);background:var(--odim);}
.combo-opt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:5px;}
.combo-opt-nm{font-weight:800;font-size:11px;margin-bottom:2px;color:var(--text);}
.combo-opt-dc{font-size:9px;color:var(--tdim);margin-bottom:4px;}
.combo-opt-pr{text-align:right;flex-shrink:0;}
.combo-opt-base{font-size:9px;color:var(--tdim);text-decoration:line-through;font-family:var(--mono);}
.combo-opt-fin{font-size:12px;font-weight:700;color:var(--orange);font-family:var(--mono);}
.combo-applied{margin-top:4px;font-size:9px;color:var(--orange);font-weight:700;}
.qnum-display{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:7px 11px;font-family:var(--mono);font-size:14px;color:var(--orange);font-weight:700;letter-spacing:.05em;}
.qnum-label{font-size:9px;color:var(--tdim);font-family:var(--mono);margin-top:3px;letter-spacing:.06em;}
.empty{text-align:center;padding:28px 12px;color:var(--tdim);font-size:11px;}
.svc-chip{background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:2px 6px;font-size:9px;color:var(--tmid);font-family:var(--mono);}
.q-list-item{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:13px;margin-bottom:7px;transition:border-color .15s;}
.q-list-item:hover{border-color:var(--border2);}
.q-list-top{display:flex;justify-content:space-between;align-items:flex-start;gap:7px;flex-wrap:wrap;}
.q-list-num{font-family:var(--mono);font-size:11px;color:var(--orange);font-weight:700;}
.q-list-client{font-size:13px;font-weight:800;color:var(--text);margin-top:1px;}
.q-list-svcs{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px;}
.q-list-actions{display:flex;gap:4px;margin-top:9px;padding-top:9px;border-top:1px solid var(--border);flex-wrap:wrap;}
.q-status-select{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:4px 7px;color:var(--text);font-size:9px;font-family:var(--mono);outline:none;cursor:pointer;}
.proj-list-item{background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:9px;overflow:hidden;}
.proj-list-hdr{padding:13px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:7px;flex-wrap:wrap;cursor:pointer;}
.proj-list-hdr:hover{background:var(--bg3);}
.proj-list-client{font-size:13px;font-weight:800;color:var(--text);}
.proj-list-meta{font-size:10px;color:var(--tdim);font-family:var(--mono);margin-top:1px;}
.proj-list-total{font-size:14px;font-weight:800;color:var(--orange);font-family:var(--mono);}
.proj-list-body{padding:13px 14px;border-top:1px solid var(--border);}
.phases-row{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap;}
.phase-item{flex:1;min-width:70px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:7px 9px;}
.phase-item.done{border-color:var(--green);background:var(--gdim);}
.phase-item.in-progress{border-color:var(--orange);background:var(--odim);}
.phase-name{font-size:10px;font-weight:700;color:var(--text);}
.phase-sel{background:transparent;border:none;font-size:9px;color:var(--tdim);font-family:var(--mono);cursor:pointer;padding:0;margin-top:3px;width:100%;outline:none;}
.phase-sel:focus{color:var(--text);}
.phase-sel option{background:var(--bg3);color:var(--text);}
.pay-bar-wrap{flex:1;min-width:80px;height:4px;background:var(--border);border-radius:3px;overflow:hidden;}
.pay-bar{height:100%;border-radius:3px;background:var(--green);transition:width .3s;}
.pay-bar.partial{background:var(--amber);}
.pay-bar.pending{background:var(--red);}
.pay-status{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:3px;font-size:9px;font-weight:700;font-family:var(--mono);}
.pay-status.paid{background:var(--gdim);color:var(--green);}
.pay-status.partial{background:var(--adim);color:var(--amber);}
.pay-status.pending{background:var(--rdim);color:var(--red);}
.payment-log{margin-top:8px;}
.pay-log-row{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.pay-log-row:last-child{border-bottom:none;}
.pay-log-method{font-size:10px;font-weight:700;color:var(--blue);}
.pay-log-amt{font-size:11px;font-family:var(--mono);color:var(--green);font-weight:700;}
.pay-log-date{font-size:9px;color:var(--tdim);font-family:var(--mono);}
.delivered-banner{background:var(--gdim);border:1px solid rgba(61,214,140,.2);border-radius:5px;padding:7px 11px;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--green);font-weight:700;margin-top:8px;}
.cal-wrap{padding:4px 0;}
.cal-nav{display:flex;align-items:center;gap:7px;margin-bottom:14px;flex-wrap:wrap;}
.cal-month-label{font-size:14px;font-weight:800;color:var(--text);min-width:150px;}
.cal-nav-btn{width:28px;height:28px;border-radius:var(--r);border:1px solid var(--border2);background:transparent;color:var(--tmid);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s;}
.cal-nav-btn:hover{border-color:var(--border3);color:var(--text);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-day-hdr{text-align:center;font-size:9px;font-weight:700;color:var(--tdim);font-family:var(--mono);padding:5px 0;letter-spacing:.04em;}
.cal-cell{background:var(--bg2);border:1px solid var(--border);border-radius:4px;min-height:68px;padding:4px;transition:border-color .15s;overflow:hidden;}
.cal-cell:hover{border-color:var(--border2);}
.cal-cell.other-month{background:var(--bg);opacity:.45;}
.cal-cell.today{border-color:var(--orange);background:var(--odim);}
.cal-day-num{font-size:10px;font-weight:700;color:var(--tmid);font-family:var(--mono);margin-bottom:2px;}
.cal-cell.today .cal-day-num{color:var(--orange);}
.cal-event{border-radius:3px;padding:2px 4px;font-size:8px;font-weight:700;margin-bottom:2px;cursor:pointer;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.cal-event.delivery{background:rgba(61,214,140,.18);color:var(--green);border-left:2px solid var(--green);}
.cal-event.phase{background:var(--odim);color:var(--orange);border-left:2px solid var(--orange);}
.cal-event.quote{background:var(--bdim);color:var(--blue);border-left:2px solid var(--blue);}
.cal-legend{display:flex;gap:12px;margin-top:9px;flex-wrap:wrap;}
.cal-legend-item{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--tdim);font-family:var(--mono);}
.cal-legend-dot{width:8px;height:8px;border-radius:2px;}

function Main({onLogout}){

  const addPayment=(pId,payment)=>{setProjects(p=>p.map(x=>{if(x.id!==pId)return x;const pays=[...x.payments,{...payment,id:`pay-${Date.now()}`}];const totalPaid=pays.reduce((a,pay)=>a+pay.amount,0);const paymentStatus=totalPaid>=x.total?"paid":totalPaid>0?"partial":"pending";return{...x,payments:pays,totalPaid,paymentStatus};}));};

    {tab==="home"&&<HomeTab setTab={setTab} quotes={quotes} projects={projects} services={services}/>}
    {tab==="catalogo"&&<CatalogoTab services={services} setServices={setServices} show={svcModal} setShow={setSvcModal} editing={editSvc} setEditing={setEditSvc}/>}
    {tab==="combos"&&<CombosTab combos={combos} setCombos={setCombos} services={services} show={comboModal} setShow={setComboModal} editing={editCombo} setEditing={setEditCombo}/>}
    {tab==="cotizar"&&<CotizarTab services={services} combos={combos} selected={selected} toggle={toggle} setQty={setQty} manualDisc={manualDisc} setManualDisc={setManualDisc} appliedCombo={appliedCombo} setAppliedCombo={setAppliedCombo} applyCombo={applyCombo} taxes={taxes} toggleTax={toggleTax} updateTaxRate={updateTaxRate} client={client} setClient={setClient} subtotal={subtotal} comboDisc={comboDisc} manualDiscAmt={manualDiscAmt} afterDisc={afterDisc} ivaAmt={ivaAmt} retencionAmt={retencionAmt} total={total} selServices={selServices} selTab={selTab} setSelTab={setSelTab} qNum={qNum} onPreview={()=>{setPreviewQ(null);setShowPreview(true);}} onSave={saveQuote}/>}
    {tab==="quotes"&&<QuotesTab quotes={quotes} onApprove={approveQuote} onStatusChange={updateQuoteStatus} onDelete={deleteQuote} onPreview={q=>{setPreviewQ(q);setShowPreview(true);}}/>}
    {tab==="proyectos"&&<ProyectosTab projects={projects} updateProject={updateProject} addPayment={addPayment} updatePhase={updatePhase}/>}
    {tab==="calendario"&&<CalendarioTab projects={projects} quotes={quotes}/>}
    {tab==="historial"&&<HistorialTab projects={projects} setProjects={setProjects}/>}
  </div>{showPreview&&<QuotePreview qNum={previewQ?.qNum||qNum} client={previewQ?.client||client} services={previewQ?.services||selServices} subtotal={previewQ?.subtotal??subtotal} comboDisc={previewQ?.comboDisc??comboDisc} manualDiscAmt={previewQ?.manualDiscAmt??manualDiscAmt} afterDisc={previewQ?.afterDisc??afterDisc} ivaAmt={previewQ?.ivaAmt??ivaAmt} retencionAmt={previewQ?.retencionAmt??retencionAmt} total={previewQ?.total??total} activeTaxes={activeTaxes} appliedCombo={previewQ?.appliedCombo||appliedCombo} onClose={()=>setShowPreview(false)}/>}
  <AppFooter setTab={setTab}/>
  </div>);
}
function HomeTab({setTab,quotes,projects,services}){
  const now=new Date();const h=now.getHours();
  const greeting=h<12?"Buenos días":h<18?"Buenas tardes":"Buenas noches";
  const thisMonth=projects.filter(p=>{const d=new Date(p.approvedAt);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();});
  const monthTotal=thisMonth.reduce((a,p)=>a+p.total,0);
  const monthCollected=thisMonth.reduce((a,p)=>a+p.totalPaid,0);
  const pendingP=projects.filter(p=>p.paymentStatus!=="paid").length;
  const pendingQ=quotes.filter(q=>q.status==="sent").length;
  const cards=[
    {key:"catalogo",color:"orange",icon:"list",name:"Catálogo de Servicios",desc:`${services.length} servicios`},
    {key:"combos",color:"blue",icon:"pkg",name:"Combos",desc:"Paquetes con descuento"},
    {key:"cotizar",color:"green",icon:"doc",name:"Nueva Cotización",desc:"Genera PDF con un clic"},
    {key:"quotes",color:"amber",icon:"send",name:"Cotizaciones",desc:`${quotes.length} total · ${pendingQ} enviadas`},
    {key:"proyectos",color:"purple",icon:"proj",name:"Proyectos",desc:`${projects.length} activos`},
    {key:"calendario",color:"teal",icon:"cal",name:"Calendario",desc:"Entregas y actividades"},
  ];
  return(<div className="home-wrap">
    <div className="home-hero"><div className="home-greeting">{greeting}, Jordan</div><div className="home-title">Bienvenido a<br/><span>Gessler Studio</span></div><div className="home-sub">Sistema de gestión · {MONTHS_ES[now.getMonth()]} {now.getFullYear()}</div></div>
    <div className="home-stats">
      <div className="home-stat"><div className="home-stat-val">{fmtC(monthTotal)}</div><div className="home-stat-lbl">Facturado mes</div></div>
      <div className="home-stat"><div className="home-stat-val" style={{color:"var(--green)"}}>{fmtC(monthCollected)}</div><div className="home-stat-lbl">Recaudado</div></div>
      <div className="home-stat"><div className="home-stat-val" style={{color:pendingP>0?"var(--amber)":"var(--green)"}}>{pendingP}</div><div className="home-stat-lbl">Por cobrar</div></div>
    </div>
    <div className="home-section-lbl">¿Qué quieres hacer?</div>
    <div className="home-cards">{cards.map(c=>(<div key={c.key} className={`home-card ${c.color}`} onClick={()=>setTab(c.key)}><div className="home-card-icon"><Icon name={c.icon} size={18}/></div><div><div className="home-card-name">{c.name}</div><div className="home-card-desc">{c.desc}</div></div><div className="home-card-arrow">›</div></div>))}</div>
    {projects.length>0&&(<><div className="home-section-lbl" style={{marginTop:4}}>Proyectos recientes</div><div className="home-recent">{projects.slice(0,4).map(p=>(<div key={p.id} className="home-recent-row" onClick={()=>setTab("proyectos")}><div className={`home-recent-dot ${p.paymentStatus}`}/><div style={{flex:1,minWidth:0}}><div className="home-recent-name">{p.client.name}</div><div className="home-recent-svc">{p.services.map(s=>s.shortName||s.name).join(" · ")}</div></div><div className="home-recent-amt">{fmtC(p.total)}</div></div>))}</div></>)}
  </div>);
}

function CatalogoTab({services,setServices,show,setShow,editing,setEditing}){

  const save=()=>{if(!form.name||!form.price)return;const svc={...form,price:Number(form.price),id:editing?.id||`s${Date.now()}`};setServices(p=>editing?p.map(x=>x.id===svc.id?svc:x):[...p,svc]);setShow(false);};

    <div className="tbl-wrap"><table><thead><tr><th>Servicio</th><th>Categoría</th><th className="hide-mob">Descripción</th><th>Precio</th><th></th></tr></thead><tbody>{services.map(s=>(<tr key={s.id}><td><strong>{s.name}</strong></td><td><span className="cat-badge">{s.category}</span></td><td className="hide-mob" style={{fontSize:10,color:"var(--tdim)",maxWidth:180}}>{s.description}</td><td><div className="price-c">{fmt(s.price)}<span style={{fontSize:9,color:"var(--tdim)",marginLeft:3}}>/{s.unit}</span></div></td><td><div className="acts"><button className="btn-icon" onClick={()=>openEdit(s)}><Icon name="edit" size={11}/></button><button className="btn-icon" onClick={()=>setServices(p=>p.filter(x=>x.id!==s.id))} style={{color:"var(--red)"}}><Icon name="trash" size={11}/></button></div></td></tr>))}</tbody></table></div>
    {show&&<div className="overlay" onClick={()=>setShow(false)}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-hdr"><div className="modal-title">{editing?"Editar":"Nuevo"} Servicio</div><button className="btn-icon" onClick={()=>setShow(false)}><Icon name="x"/></button></div>
      <div style={{display:"flex",flexDirection:"column",gap:9}}><div className="g2"><div className="field"><label>Nombre</label><input className="input" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="ej. Diseño de Logo"/></div><div className="field"><label>Nombre corto</label><input className="input" value={form.shortName} onChange={e=>setForm(f=>({...f,shortName:e.target.value}))} placeholder="ej. Logo"/></div></div>
      <div className="field"><label>Categoría</label><select className="input" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>{cats.map(c=><option key={c}>{c}</option>)}</select></div>
      <div className="field"><label>Descripción</label><textarea className="input" value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} placeholder="¿Qué incluye?"/></div>
      <div className="g2"><div className="field"><label>Precio (COP)</label><input className="input" type="number" value={form.price} onChange={e=>setForm(f=>({...f,price:e.target.value}))} placeholder="380000"/></div><div className="field"><label>Unidad</label><select className="input" value={form.unit} onChange={e=>setForm(f=>({...f,unit:e.target.value}))}>{["proyecto","pieza","hora","mes","unidad","página"].map(u=><option key={u}>{u}</option>)}</select></div></div></div>
      <div className="flex-end"><button className="btn btn-ghost" onClick={()=>setShow(false)}>Cancelar</button><button className="btn btn-primary" onClick={save}><Icon name="check" size={11}/>Guardar</button></div></div></div>}</>);
}

function CombosTab({combos,setCombos,services,show,setShow,editing,setEditing}){
  const blank={name:"",description:"",serviceIds:[],discount:10};const [form,setForm]=useState(blank);
  const openNew=()=>{setForm(blank);setEditing(null);setShow(true);};const openEdit=c=>{setForm({...c});setEditing(c);setShow(true);};
  const save=()=>{if(!form.name||form.serviceIds.length<2)return;const c={...form,id:editing?.id||`c${Date.now()}`};setCombos(p=>editing?p.map(x=>x.id===c.id?c:x):[...p,c]);setShow(false);};
  const tSvc=id=>setForm(f=>({...f,serviceIds:f.serviceIds.includes(id)?f.serviceIds.filter(x=>x!==id):[...f.serviceIds,id]}));
  const cp=c=>{const base=c.serviceIds.reduce((a,id)=>{const s=services.find(x=>x.id===id);return a+(s?s.price:0);},0);return{base,final:Math.round(base*(1-c.discount/100))};};
  return(<><div className="sec-hdr"><div><div className="sec-title">Combos <span>Promocionales</span></div><div className="sec-sub">{combos.length} paquetes</div></div><button className="btn btn-primary btn-fmob" onClick={openNew}><Icon name="plus" size={11}/>Nuevo</button></div>
    <div className="combo-grid">{combos.map(c=>{const{base,final}=cp(c);return(<div key={c.id} className="combo-card"><div className="combo-name">{c.name}</div><div className="combo-desc">{c.description}</div><div style={{fontSize:9,color:"var(--tdim)",marginBottom:6,lineHeight:1.8}}>{c.serviceIds.map(id=>{const s=services.find(x=>x.id===id);return s?<span key={id} style={{display:"block"}}>· {s.name}</span>:null;})}</div><span className="combo-badge"><Icon name="tag" size={8}/>{c.discount}% dto</span><div className="combo-prices"><div className="combo-orig">{fmt(base)}</div><div className="combo-fin">{fmt(final)}</div></div><div className="combo-acts"><button className="btn btn-ghost btn-sm" onClick={()=>openEdit(c)}><Icon name="edit" size={10}/>Editar</button><button className="btn btn-danger btn-sm" onClick={()=>setCombos(p=>p.filter(x=>x.id!==c.id))}><Icon name="trash" size={10}/></button></div></div>);})}</div>
    {show&&<div className="overlay" onClick={()=>setShow(false)}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-hdr"><div className="modal-title">{editing?"Editar":"Nuevo"} Combo</div><button className="btn-icon" onClick={()=>setShow(false)}><Icon name="x"/></button></div>
      <div style={{display:"flex",flexDirection:"column",gap:9}}><div className="field"><label>Nombre</label><input className="input" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="ej. Starter Pack"/></div><div className="field"><label>Descripción</label><input className="input" value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} placeholder="Descripción breve"/></div><div className="field"><label>Descuento (%)</label><input className="input" type="number" min="1" max="50" value={form.discount} onChange={e=>setForm(f=>({...f,discount:Number(e.target.value)}))} style={{maxWidth:80}}/></div>
      <div className="field"><label>Servicios (mín. 2)</label><div style={{border:"1px solid var(--border2)",borderRadius:4,padding:"5px 8px",maxHeight:170,overflowY:"auto"}}>{services.map(s=>(<div key={s.id} style={{display:"flex",alignItems:"center",gap:6,padding:"5px 0",borderBottom:"1px solid var(--border)",cursor:"pointer"}} onClick={()=>tSvc(s.id)}><div style={{width:13,height:13,borderRadius:3,border:"1px solid var(--border2)",display:"flex",alignItems:"center",justifyContent:"center",background:form.serviceIds.includes(s.id)?"var(--orange)":"transparent",borderColor:form.serviceIds.includes(s.id)?"var(--orange)":"var(--border2)",flexShrink:0}}>{form.serviceIds.includes(s.id)&&<Icon name="check" size={9}/>}</div><span style={{fontSize:10,flex:1,color:"var(--text)"}}>{s.name}</span><span style={{fontSize:9,fontFamily:"var(--mono)",color:"var(--orange)"}}>{fmt(s.price)}</span></div>))}</div></div></div>
      <div className="flex-end"><button className="btn btn-ghost" onClick={()=>setShow(false)}>Cancelar</button><button className="btn btn-primary" onClick={save}><Icon name="check" size={11}/>Guardar</button></div></div></div>}</>);
}
function CotizarTab({services,combos,selected,toggle,setQty,manualDisc,setManualDisc,appliedCombo,setAppliedCombo,applyCombo,taxes,toggleTax,updateTaxRate,client,setClient,subtotal,comboDisc,manualDiscAmt,afterDisc,ivaAmt,retencionAmt,total,selServices,selTab,setSelTab,qNum,onPreview,onSave}){
  const cats=getCats(services);
  const cp=c=>{const base=c.serviceIds.reduce((a,id)=>{const s=services.find(x=>x.id===id);return a+(s?s.price:0);},0);return{base,final:Math.round(base*(1-c.discount/100))};};
  return(<><div className="sec-hdr"><div><div className="sec-title">Nueva <span>Cotización</span></div><div style={{display:"flex",flexDirection:"column",gap:2,marginTop:5}}><div className="qnum-display">{qNum}</div><div className="qnum-label">Número auto-generado (MM-DD-AA-NNN)</div></div></div><button className="btn btn-blue btn-fmob" onClick={onPreview} disabled={selServices.length===0}><Icon name="eye" size={11}/>Vista Previa</button></div>

        <div style={{marginBottom:12,paddingBottom:12,borderBottom:"1px solid var(--border)"}}>

          <div className="g2"><div className="field"><label>Nombre / Empresa</label><input className="input" value={client.name} onChange={e=>setClient(c=>({...c,name:e.target.value}))} placeholder="Cliente"/></div><div className="field"><label>NIT / Cédula</label><input className="input" value={client.nit} onChange={e=>setClient(c=>({...c,nit:e.target.value}))} placeholder="900.123.456-7"/></div><div className="field"><label>Email</label><input className="input" value={client.email} onChange={e=>setClient(c=>({...c,email:e.target.value}))} placeholder="email@..."/></div><div className="field"><label>Teléfono</label><input className="input" value={client.phone} onChange={e=>setClient(c=>({...c,phone:e.target.value}))} placeholder="+57 300 000 0000"/></div></div>
        </div>

        {selTab==="combos"&&combos.map(c=>{const{base,final}=cp(c);const on=appliedCombo?.id===c.id;return(<div key={c.id} className={`combo-opt ${on?"on":""}`} onClick={()=>on?setAppliedCombo(null):applyCombo(c)}><div className="combo-opt-top"><div><div className="combo-opt-nm">{c.name}</div><div className="combo-opt-dc">{c.description}</div><span style={{background:"var(--gdim)",color:"var(--green)",padding:"1px 5px",borderRadius:3,fontSize:9,fontFamily:"var(--mono)",fontWeight:700}}>-{c.discount}%</span></div><div className="combo-opt-pr"><div className="combo-opt-base">{fmt(base)}</div><div className="combo-opt-fin">{fmt(final)}</div></div></div>{on&&<div className="combo-applied">✓ Aplicado — toca para quitar</div>}</div>);})}

        {selServices.length===0?<div className="empty">Sin servicios</div>:selServices.map(s=>(<div key={s.id} className="sum-item"><div className="sum-nm">{s.name}{s.qty>1&&<span style={{color:"var(--orange)",marginLeft:3}}>×{s.qty}</span>}</div><div className="sum-pr">{fmt(s.price*s.qty)}</div></div>))}
        <hr className="sum-div"/>
        <div className="sum-tot-row" style={{marginBottom:3}}><span style={{fontSize:9,color:"var(--tdim)",fontFamily:"var(--mono)"}}>Subtotal</span><span style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--text)"}}>{fmt(subtotal)}</span></div>
        {comboDisc>0&&<div className="disc-row"><span>Combo -{appliedCombo.discount}%</span><span>-{fmt(comboDisc)}</span></div>}

        {taxes.some(t=>t.enabled)&&<div style={{marginTop:7}}>{ivaAmt>0&&<div className="tax-row add"><span>IVA</span><span>+{fmt(ivaAmt)}</span></div>}{taxes.filter(t=>t.enabled&&t.type==="subtract").map(t=>{const amt=t.id==="reteiva"?ivaAmt*(t.rate/100):afterDisc*(t.rate/100);return amt>0&&<div key={t.id} className="tax-row sub"><span>{t.name}</span><span>-{fmt(amt)}</span></div>;})}</div>}
        <hr className="sum-div"/>

        <div style={{display:"flex",flexDirection:"column",gap:5,marginTop:10}}>
          <button className="btn btn-blue" style={{width:"100%",justifyContent:"center"}} onClick={onPreview} disabled={selServices.length===0}><Icon name="printer" size={11}/>Previsualizar PDF</button>
          <button className="btn btn-primary" style={{width:"100%",justifyContent:"center"}} onClick={onSave} disabled={selServices.length===0||!client.name}><Icon name="save" size={11}/>Guardar Cotización</button>
          {selServices.length>0&&!client.name&&<div style={{fontSize:9,color:"var(--tdim)",fontFamily:"var(--mono)",textAlign:"center"}}>Agrega nombre del cliente para guardar</div>}
        </div>
      </div></div>
    </div>
  </>);
}

function CalendarioTab({projects,quotes}){
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());const [month,setMonth]=useState(now.getMonth());
  const [detail,setDetail]=useState(null);
  const prevM=()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);};
  const nextM=()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);};
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const daysInPrev=new Date(year,month,0).getDate();
  const cells=[];
  for(let i=firstDay-1;i>=0;i--)cells.push({day:daysInPrev-i,curr:false});
  for(let d=1;d<=daysInMonth;d++)cells.push({day:d,curr:true});
  while(cells.length%7!==0)cells.push({day:cells.length-firstDay-daysInMonth+1,curr:false});
  const events={};
  const addEv=(k,ev)=>{if(!events[k])events[k]=[];events[k].push(ev);};
  projects.forEach(p=>{
    if(p.deliveryDate)addEv(p.deliveryDate,{type:"delivery",label:`🚀 ${p.client.name}`,proj:p});
    p.phases.forEach(ph=>{if(ph.startDate&&ph.status!=="done")addEv(ph.startDate,{type:"phase",label:`${ph.name}: ${p.client.name}`,proj:p,phase:ph});});
  });
  quotes.filter(q=>q.status==="sent").forEach(q=>{const d=q.createdAt.split("T")[0];addEv(d,{type:"quote",label:`💬 ${q.client.name}`,quote:q});});
  const todayKey=todayISO();
  return(<><div className="sec-hdr"><div><div className="sec-title">Calendario de <span>Actividades</span></div></div></div>
    <div className="cal-nav"><div className="month-nav"><button className="cal-nav-btn" onClick={prevM}>‹</button><span className="cal-month-label">{MONTHS_ES[month]} {year}</span><button className="cal-nav-btn" onClick={nextM}>›</button></div><button className="btn btn-ghost btn-sm" onClick={()=>{setYear(now.getFullYear());setMonth(now.getMonth());}}>Hoy</button></div>
    <div className="cal-grid">
      {DAYS_ES.map(d=><div key={d} className="cal-day-hdr">{d}</div>)}
      {cells.map((cell,i)=>{const key=cell.curr?`${year}-${pad2(month+1)}-${pad2(cell.day)}`:"";const dayEvs=key?events[key]||[]:[]; const isToday=key===todayKey;return(<div key={i} className={`cal-cell ${!cell.curr?"other-month":""} ${isToday?"today":""}`}><div className="cal-day-num">{cell.day}</div>{dayEvs.map((ev,ei)=>(<div key={ei} className={`cal-event ${ev.type}`} onClick={()=>setDetail(ev)} title={ev.label}>{ev.label}</div>))}</div>);})}
    </div>
    <div className="cal-legend"><div className="cal-legend-item"><div className="cal-legend-dot" style={{background:"var(--green)"}}/>Entregas</div><div className="cal-legend-item"><div className="cal-legend-dot" style={{background:"var(--orange)"}}/>Fases activas</div><div className="cal-legend-item"><div className="cal-legend-dot" style={{background:"var(--blue)"}}/>Cotizaciones enviadas</div></div>
    {detail&&<div className="overlay" onClick={()=>setDetail(null)}><div className="modal" style={{maxWidth:360}} onClick={e=>e.stopPropagation()}>
      <div className="modal-hdr"><div className="modal-title">{detail.type==="delivery"?"Entrega":detail.type==="phase"?"Fase":"Cotización"}</div><button className="btn-icon" onClick={()=>setDetail(null)}><Icon name="x"/></button></div>
      {detail.proj&&<><div style={{fontWeight:800,fontSize:13,color:"var(--text)",marginBottom:3}}>{detail.proj.client.name}</div><div style={{fontSize:10,color:"var(--tdim)",fontFamily:"var(--mono)",marginBottom:7}}>{detail.proj.qNum}</div>{detail.type==="delivery"&&<div style={{fontSize:11,color:"var(--green)"}}>🚀 Fecha de entrega: {detail.proj.deliveryDate}</div>}{detail.type==="phase"&&<div style={{fontSize:11,color:"var(--orange)"}}>Fase: <strong style={{color:"var(--text)"}}>{detail.phase.name}</strong> — {detail.phase.status}</div>}<div style={{marginTop:8,fontFamily:"var(--mono)",fontSize:13,color:"var(--orange)",fontWeight:700}}>{fmt(detail.proj.total)}</div></>}
      {detail.quote&&<><div style={{fontWeight:800,fontSize:13,color:"var(--text)",marginBottom:3}}>{detail.quote.client.name}</div><div style={{fontSize:10,color:"var(--tdim)",fontFamily:"var(--mono)",marginBottom:5}}>{detail.quote.qNum}</div><div style={{fontFamily:"var(--mono)",fontSize:13,color:"var(--orange)",fontWeight:700}}>{fmt(detail.quote.total)}</div><div style={{fontSize:10,color:"var(--blue)",marginTop:4}}>Cotización enviada · pendiente respuesta</div></>}
      <div className="flex-end"><button className="btn btn-ghost" onClick={()=>setDetail(null)}>Cerrar</button></div>
    </div></div>}
  </>);
}

        <div>{detailModal.services.map(s=><div key={s.id} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid var(--border)"}}><span style={{fontSize:11,color:"var(--text)"}}>{s.name}{s.qty>1&&<span style={{color:"var(--orange)",marginLeft:3}}>×{s.qty}</span>}</span><span style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--orange)"}}>{fmt(s.price*s.qty)}</span></div>)}</div>

function QuotePreview({qNum,client,services,subtotal,comboDisc,manualDiscAmt,afterDisc,ivaAmt,retencionAmt,total,activeTaxes,appliedCombo,onClose}){
  const d=new Date().toLocaleDateString("es-CO",{day:"2-digit",month:"long",year:"numeric"});
  const h=new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"});
  const v=new Date(Date.now()+15*24*60*60*1000).toLocaleDateString("es-CO",{day:"2-digit",month:"long",year:"numeric"});
  const printQuote=()=>{
    const el=document.querySelector('.qdoc');
    if(!el)return;
    const base=window.location.href.replace(/[^\/]*$/,'');
    const html=el.outerHTML.replace(/src="img\//g,`src="${base}img/`);
    const styles=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
    const w=window.open('','_blank');
    if(!w)return;
    w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"/><style>${styles}body{background:#fff!important;margin:0;padding:0;}</style></head><body style="background:#fff;margin:0;padding:0;">${html}</body></html>`);
    w.document.close();
    w.onload=()=>{w.focus();w.print();};
  };
  return(<div className="prev-ov no-print">
    <style>{`@media(max-width:820px){.prev-doc-wrap{padding:8px 0!important;justify-content:flex-start!important;}.qdoc{transform:scale(calc(min(1, (100vw - 0px) / 794)));transform-origin:top left!important;margin-bottom:calc((min(1,(100vw)/794) - 1) * 1040px)!important;}}`}</style>
    <div className="prev-tb"><div className="prev-ttl">{qNum} · {d}</div><div className="prev-acts"><button className="btn btn-primary" onClick={printQuote}><Icon name="printer" size={11}/>Imprimir / PDF</button><button className="btn btn-ghost" onClick={onClose}><Icon name="x" size={11}/>Cerrar</button></div></div>
    <div className="prev-doc-wrap">
    <div className="qdoc">
      <div className="qdoc-hdr"><div><img src="img/logo-gessler-studio.svg" alt="Gessler Studio" style={{height:32,marginBottom:5,display:"block"}}/><div className="qdoc-tag">PRECISION UNDER PRESSURE</div></div><div className="qdoc-hdr-r"><div className="qdoc-qlbl">Cotización</div><div className="qdoc-qnum">{qNum}</div><div className="qdoc-date">{d} · {h}</div></div></div>
      <div className="qdoc-bar"/>
      <div className="qdoc-body">
        <div className="qdoc-info-row">
          <div><div className="qdoc-slbl">Preparado para</div><div className="qdoc-cname">{client?.name||"Cliente"}</div><div className="qdoc-cdet">{client?.nit&&<span>NIT / CC: {client.nit}<br/></span>}{client?.email&&<span>{client.email}<br/></span>}{client?.phone&&<span>{client.phone}</span>}</div></div>
          <div><div className="qdoc-slbl" style={{textAlign:"right"}}>Emitido por</div><div className="qdoc-studio-info"><strong style={{fontSize:11,color:"#111",fontWeight:800}}>Gessler Studio</strong><br/>{BRAND.email}<br/>{BRAND.phone}<br/>{BRAND.web}<br/>{BRAND.city}</div></div>
        </div>
        <div className="qdoc-svcs-hdr"><span>Servicio</span><span>Cant.</span><span style={{textAlign:"right"}}>Precio</span></div>
        {(services||[]).map(s=>(<div key={s.id} className="qdoc-svc-row"><div><div className="qdoc-svc-nm">{s.name}</div><div className="qdoc-svc-dc">{s.description}</div></div><div className="qdoc-svc-qty">{s.qty} {s.unit}</div><div className="qdoc-svc-pr">{fmt(s.price*s.qty)}</div></div>))}
        <div className="qdoc-totals"><div className="qdoc-tbox">
          <div className="qdoc-tr"><span>Subtotal</span><span>{fmt(subtotal)}</span></div>
          {comboDisc>0&&<div className="qdoc-tr disc"><span>Combo ({appliedCombo?.discount}%)</span><span>-{fmt(comboDisc)}</span></div>}
          {manualDiscAmt>0&&<div className="qdoc-tr disc"><span>Desc. adicional</span><span>-{fmt(manualDiscAmt)}</span></div>}
          {(comboDisc>0||manualDiscAmt>0)&&<div className="qdoc-tr" style={{fontWeight:700,color:"#333"}}><span>Base gravable</span><span>{fmt(afterDisc)}</span></div>}
          {ivaAmt>0&&<div className="qdoc-tr tax-add"><span>IVA (19%)</span><span>+{fmt(ivaAmt)}</span></div>}
          {(activeTaxes||[]).filter(t=>t.type==="subtract").map(t=>{const amt=t.id==="reteiva"?ivaAmt*(t.rate/100):afterDisc*(t.rate/100);return amt>0&&<div key={t.id} className="qdoc-tr tax-sub"><span>{t.name}</span><span>-{fmt(amt)}</span></div>;})}
          <div className="qdoc-tfin"><span className="qdoc-tfin-lbl">Total</span><span className="qdoc-tfin-amt">{fmt(total)}</span></div>
        </div></div>
        {client?.notes&&<div className="qdoc-notes"><div className="qdoc-slbl" style={{marginBottom:3}}>Notas</div><p>{client.notes}</p></div>}
        <div className="qdoc-valid">Válida hasta el <strong>{v}</strong>. Precios en COP. Inicio requiere 50% de anticipo. Generada el {d} a las {h}.</div>
      </div>
      <div className="qdoc-ftr"><div className="qdoc-ftr-info">{BRAND.email} · {BRAND.phone}<br/>{BRAND.web} · {BRAND.city}</div><div className="qdoc-ftr-tag">{BRAND.tagline}</div></div>
    </div>
    </div>
  </div>);
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
